[build]
  command = "npm run build"
  publish = "dist"
  base = "."

[functions]
  directory = "netlify/functions"

# Proxy API calls to the Render service (must sit above the SPA catch-all).
# If your Render URL differs, update the `to` host.
[[redirects]]
  from = "/api/*"
  to = "https://mbatfoundation.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
